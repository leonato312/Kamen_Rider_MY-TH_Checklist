<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kamen Rider Myth — Checklist</title>
<!--
  ============================================================================
  KAMEN RIDER MY-TH — CATALOGO + CHECKLIST
  ============================================================================
  Archivo unico: HTML5 + CSS3 + Vanilla JS. Sin frameworks, sin build.

  DOS SUPERFICIES (Maestro 1 §1):

    1. CATALOGO CENTRAL — las 7 categorias, referencia historica.
       categoria [seccion plegable] > procedencia [divisor de texto] > tarjetas
       Las tarjetas muestran imagen, fecha y precio. Solo las de GIMMICK
       llevan selector de estado: son la unica superficie interactiva.

    2. BARRA LATERAL — checklist, EXCLUSIVA de Gimmicks.
       subtipo/acabado [acordeon] > procedencia de gimmick > piezas
       Orden invertido respecto al catalogo a proposito: aqui la pregunta es
       "que Legend me falta", no "que hay en DX".

  DONDE EDITAR: PIEZAS_CATALOG (BLOQUE 2) y PRODUCTS (BLOQUE 3). Contadores,
  barras, indices inversos y cobertura se derivan solos.
  ============================================================================
-->
<style>
/* ===========================================================================
   1. TOKENS DE DISENO — cambiar aqui un color lo cambia en toda la pagina
   =========================================================================== */
:root{
  /* Superficies (de mas profunda a mas elevada) */
  --bg:            #0b0d12;
  --surface-1:     #12151d;
  --surface-2:     #181c26;
  --surface-3:     #212636;
  --border:        #2a3040;
  --border-strong: #3a4256;

  /* Texto */
  --text:      #e8eaf0;
  --text-dim:  #99a1b3;
  --text-mute: #667085;

  /* Acentos del GIMMICK: oro = linea DX, cian = linea SG.
     Son los dos tonos fuertes y se reservan al coleccionable principal
     (Maestro 3 §7): si todo grita igual, se pierde cual importa. */
  --dx:      #f0b429;
  --dx-soft: rgba(240,180,41,.13);
  --sg:      #35d0d8;
  --sg-soft: rgba(53,208,216,.13);
  --menor:   #ff8fab;   /* gimmick menor: Bone Buckles */

  /* Un color por CATEGORIA, no por procedencia. Tonos suaves: el gimmick
     manda y estos no deben competir. */
  --protagonista: #7ee0c2;
  --dispositivo:  #e8c26a;
  --arma:         #d98cf0;
  --aparicion:    #9b8fb0;
  --extra:        #8a8a8a;

  /* Estados de producto */
  --pending:    #667085;
  --reserved:   #f0b429;
  --owned:      #37d67a;
  --owned-soft: rgba(55,214,122,.13);
  --covered:    #9db6ff;
  --covered-soft: rgba(120,160,255,.12);

  /* Metricas */
  --radius:   14px;
  --radius-s: 9px;
  --gap:      18px;
  --panel-w:  400px;

  --font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}

/* ===========================================================================
   2. BASE
   =========================================================================== */
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; scroll-padding-top:150px; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{ font:inherit; color:inherit; cursor:pointer; border:none; background:none; }
ul{ margin:0; padding:0; list-style:none; }
img{ display:block; max-width:100%; }
:focus-visible{ outline:2px solid var(--dx); outline-offset:2px; border-radius:4px; }

/* Halo de fondo para que el dark no se sienta plano */
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 420px at 12% -8%, rgba(240,180,41,.07), transparent 60%),
    radial-gradient(760px 380px at 92% 4%, rgba(53,208,216,.06), transparent 60%);
}

/* ===========================================================================
   3. CABECERA — titulo + progreso del gimmick + acceso a la checklist
   =========================================================================== */
.header{
  position:sticky; top:0; z-index:40;
  background:rgba(11,13,18,.86); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.header__inner{
  max-width:1560px; margin:0 auto; padding:14px 26px;
  display:flex; align-items:center; gap:26px; flex-wrap:wrap;
}
.brand{ display:flex; flex-direction:column; gap:2px; margin-right:auto; }
.brand__title{ margin:0; font-size:19px; font-weight:700; letter-spacing:.02em; }
.brand__title span{ color:var(--dx); }
.brand__sub{
  font-size:11px; color:var(--text-mute);
  letter-spacing:.09em; text-transform:uppercase;
}

/* Mini barras del gimmick, siempre visibles. Solo las lineas del
   coleccionable: las demas categorias no llevan progreso. */
.mini-stats{ display:flex; gap:12px; }
.mini-stat{
  min-width:136px; padding:9px 13px; border-radius:var(--radius-s);
  background:var(--surface-1); border:1px solid var(--border);
}
.mini-stat__top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.mini-stat__label{ font-size:11px; font-weight:700; letter-spacing:.09em; }
.mini-stat__count{ font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.mini-stat__bar{ height:4px; margin-top:7px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
.mini-stat__fill{ height:100%; border-radius:99px; width:0; transition:width .35s ease; }
.mini-stat--dx    .mini-stat__label{ color:var(--dx); }
.mini-stat--dx    .mini-stat__fill { background:var(--dx); }
.mini-stat--sg    .mini-stat__label{ color:var(--sg); }
.mini-stat--sg    .mini-stat__fill { background:var(--sg); }
.mini-stat--menor{ min-width:110px; }
.mini-stat--menor .mini-stat__label{ color:var(--menor); }
.mini-stat--menor .mini-stat__fill { background:var(--menor); }

.btn-panel{
  display:flex; align-items:center; gap:9px;
  padding:10px 17px; border-radius:var(--radius-s);
  background:var(--dx); color:#1a1405; font-weight:700; font-size:13px;
  transition:filter .15s ease, transform .15s ease;
}
.btn-panel:hover{ filter:brightness(1.1); transform:translateY(-1px); }
.btn-panel__n{ font-variant-numeric:tabular-nums; background:rgba(0,0,0,.16);
  border-radius:6px; padding:1px 7px; }

/* ===========================================================================
   4. CAJA DE NUEVOS LANZAMIENTOS
   Solo se dibuja si el repositorio esta CERRADO (Maestro 1 §7).
   =========================================================================== */
.novedades{
  max-width:1560px; margin:22px auto 0; padding:14px 20px;
  border-radius:var(--radius); background:var(--surface-1);
  border:1px solid rgba(240,180,41,.45);
  box-shadow:0 0 0 1px rgba(240,180,41,.10);
  position:relative; z-index:1;
}
.novedades__title{
  font-size:10.5px; font-weight:800; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dx); margin-bottom:5px;
}
.novedades__body{ font-size:12.5px; color:var(--text-dim); }

/* ===========================================================================
   5. CATALOGO CENTRAL — categoria > procedencia > tarjetas
   =========================================================================== */
.main{ position:relative; z-index:1; max-width:1560px; margin:0 auto; padding:30px 26px 90px; }

.cat{
  margin-bottom:16px; border-radius:var(--radius); overflow:hidden;
  background:var(--surface-1); border:1px solid var(--border);
}
.cat__head{
  width:100%; display:flex; align-items:center; gap:16px;
  padding:19px 22px; text-align:left;
  background:linear-gradient(180deg, var(--surface-2), var(--surface-1));
  transition:background .18s ease;
}
.cat__head:hover{ background:var(--surface-3); }
.cat__chevron{
  flex:0 0 auto; width:20px; height:20px; color:var(--text-dim);
  transition:transform .28s ease, color .28s ease;
}
.cat[data-open="true"] .cat__chevron{ transform:rotate(90deg); color:var(--cat); }
.cat__title{ font-size:20px; font-weight:700; color:var(--cat); }
.cat__meta{ margin-left:auto; display:flex; align-items:center; gap:9px; flex-wrap:wrap; }

.chip{
  padding:4px 11px; border-radius:99px; font-size:11px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; white-space:nowrap;
  background:var(--surface-3); color:var(--text-dim); border:1px solid var(--border);
}
.chip--count{ color:var(--text); }
.chip--track{ background:var(--dx-soft); color:var(--dx); border-color:rgba(240,180,41,.4); }
.chip--done{ background:var(--owned-soft); color:var(--owned); border-color:rgba(55,214,122,.35); }

/* Animacion con max-height: sin librerias y sin saltos de layout */
.cat__body{ max-height:0; overflow:hidden; transition:max-height .38s ease; }
.cat[data-open="true"] .cat__body{ max-height:40000px; }
.cat__inner{ padding:6px 22px 26px; }

/* --- Procedencia: DIVISOR DE TEXTO, sin acordeon (Maestro 1 §4) --- */
.proc{ margin-top:24px; }
.proc__head{
  display:flex; align-items:center; gap:12px; margin-bottom:14px;
  padding-bottom:9px; border-bottom:1px solid var(--border);
}
.proc__name{
  font-size:12px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-dim);
}
.proc__rule{ flex:1; }
.proc__n{ font-size:12px; color:var(--text-mute); font-variant-numeric:tabular-nums; }

.grid{
  display:grid; gap:var(--gap);
  grid-template-columns:repeat(auto-fill, minmax(252px, 1fr));
}

/* ===========================================================================
   6. TARJETA DE PRODUCTO
   =========================================================================== */
.card{
  display:flex; flex-direction:column;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--radius); overflow:hidden;
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  scroll-margin-top:160px;
}
.card:hover{
  transform:translateY(-3px); border-color:var(--border-strong);
  box-shadow:0 12px 28px rgba(0,0,0,.4);
}
.card[data-state="reserved"]{ border-color:rgba(240,180,41,.5); }
.card[data-state="owned"]{ border-color:rgba(55,214,122,.5); }
/* Producto que ya no hace falta porque viene dentro de otro que tienes.
   Se atenua sin ocultarse: sigue siendo comprable si lo quieres suelto. */
.card[data-covered="true"]{ border-color:rgba(120,160,255,.35); }
.card[data-covered="true"] .card__media{ opacity:.5; }
.card[data-covered="true"] .card__title{ color:var(--text-dim); }
.card__covered{
  margin:0; padding:6px 9px; border-radius:7px;
  font-size:10.5px; line-height:1.4; font-weight:600;
  background:var(--covered-soft); color:var(--covered);
  border:1px solid rgba(120,160,255,.3);
}
.card--flash{ animation:flash 1.6s ease; }
@keyframes flash{
  0%,100%{ box-shadow:0 0 0 0 rgba(240,180,41,0); }
  20%    { box-shadow:0 0 0 3px rgba(240,180,41,.55); }
}

/* Zona de imagen: relacion fija para que el grid no baile con fotos dispares.
   `contain` y no `cover`: las fichas de Bandai vienen recortadas de formas
   distintas y `cover` corta cabezas. */
.card__media{
  position:relative; aspect-ratio:4/3; background:var(--surface-1);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  cursor:zoom-in;
}
.card__img{
  width:100%; height:100%; object-fit:contain; padding:10px;
  transition:transform .3s ease;
}
.card:hover .card__img{ transform:scale(1.045); }
/* Placeholder visible mientras la imagen no haya cargado */
.card__ph{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--text-mute); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  background:repeating-linear-gradient(45deg,#141821,#141821 11px,#171c26 11px,#171c26 22px);
}
.card__media.is-loaded .card__ph{ display:none; }

/* Badges sobre la imagen */
.card__badges{
  position:absolute; top:9px; left:9px; display:flex; gap:6px; flex-wrap:wrap;
  max-width:calc(100% - 18px); z-index:2;
}
.badge{
  padding:3px 8px; border-radius:6px; font-size:10px; font-weight:800;
  letter-spacing:.07em; text-transform:uppercase; backdrop-filter:blur(6px);
}
.badge--dx{ background:var(--dx-soft); color:var(--dx); box-shadow:inset 0 0 0 1px rgba(240,180,41,.4); }
.badge--sg{ background:var(--sg-soft); color:var(--sg); box-shadow:inset 0 0 0 1px rgba(53,208,216,.4); }
.badge--promo{ background:rgba(190,120,255,.15); color:#c79bff; box-shadow:inset 0 0 0 1px rgba(190,120,255,.4); }
.badge--azar{ background:rgba(255,255,255,.09); color:var(--text-dim); box-shadow:inset 0 0 0 1px var(--border-strong); }
/* Producto que pertenece a mas de una categoria (figura + gimmick) */
.badge--cross{ background:var(--covered-soft); color:var(--covered); box-shadow:inset 0 0 0 1px rgba(120,160,255,.4); }

/* Marca de obtenido, esquina superior derecha */
.card__tick{
  position:absolute; top:9px; right:9px; width:24px; height:24px; border-radius:50%;
  display:none; align-items:center; justify-content:center; z-index:2;
  background:var(--owned); color:#05230f; font-size:14px; font-weight:900;
}
.card[data-state="owned"] .card__tick{ display:flex; }

.card__body{ padding:13px 14px 14px; display:flex; flex-direction:column; gap:11px; flex:1; }
.card__title{ font-size:13.5px; font-weight:600; line-height:1.35; }
.card__row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-top:auto; }
.card__price{ font-size:15px; font-weight:700; color:var(--dx); font-variant-numeric:tabular-nums; }
.card__price--nr{ color:var(--text-mute); font-size:12px; font-weight:600; font-style:italic; }
.card__date{
  font-size:11px; font-weight:600; color:var(--text-dim);
  white-space:nowrap; text-transform:uppercase; letter-spacing:.04em;
}
.card__date--past{ color:var(--text-mute); font-weight:500; }

/* ---- Selector de estado: solo en tarjetas de GIMMICK ---- */
.states{
  display:grid; grid-template-columns:repeat(3,1fr); gap:4px;
  padding:3px; background:var(--surface-1);
  border:1px solid var(--border); border-radius:8px;
}
.state-btn{
  padding:6px 4px; border-radius:6px; font-size:10.5px; font-weight:700;
  letter-spacing:.04em; color:var(--text-mute); text-align:center;
  transition:background .15s ease, color .15s ease;
}
.state-btn:hover{ background:var(--surface-3); color:var(--text-dim); }
.state-btn[aria-pressed="true"]{ color:#0b0d12; }
.state-btn[data-state="pending"][aria-pressed="true"]{ background:var(--pending); color:#e8eaf0; }
.state-btn[data-state="reserved"][aria-pressed="true"]{ background:var(--reserved); }
.state-btn[data-state="owned"][aria-pressed="true"]{ background:var(--owned); }

/* ---- Desplegable de contenidos ----
   Borde CONTINUO si la entrega esta garantizada, PUNTEADO si es de azar:
   llamarlos igual daria a entender que comprar un set es una loteria. */
.contents{
  border:1px solid var(--border); border-radius:var(--radius-s);
  background:var(--surface-1); overflow:hidden;
}
.contents--azar{ border-style:dashed; border-color:var(--border-strong); }
.contents__toggle{
  display:flex; align-items:center; gap:8px; padding:8px 11px;
  font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  color:var(--text-dim); cursor:pointer; list-style:none;
  transition:background .15s ease, color .15s ease;
}
.contents__toggle::-webkit-details-marker{ display:none; }
.contents__toggle:hover{ background:var(--surface-3); color:var(--text); }
.contents__arrow{ margin-left:auto; transition:transform .25s ease; }
.contents[open] .contents__arrow{ transform:rotate(90deg); }
.contents__n{
  padding:1px 6px; border-radius:99px; font-size:10px;
  background:var(--surface-3); color:var(--text-dim);
}
.contents__list{ padding:4px 10px 11px; display:flex; flex-direction:column; gap:5px; }
.contents__item{
  display:flex; align-items:center; gap:8px;
  padding:5px 7px; border-radius:6px; font-size:12px;
  background:var(--surface-2);
}
.contents__dot{ flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--text-mute); }
.contents__item--tengo .contents__dot{ background:var(--owned); }
.contents__item--tengo .contents__name{ color:var(--owned); }
.contents__item--cubierto .contents__dot{ background:var(--owned); opacity:.55; }
.contents__name{ flex:1; min-width:0; }

/* ===========================================================================
   7. VISOR DE GALERIA
   Pulsar la portada abre las fotos en superposicion. Nunca una segunda
   pagina por producto: esto es una checklist, no una tienda.
   =========================================================================== */
.viewer{
  position:fixed; inset:0; z-index:80;
  display:flex; align-items:center; justify-content:center;
  background:rgba(5,7,11,.94); backdrop-filter:blur(6px);
  opacity:0; visibility:hidden; transition:opacity .22s ease, visibility .22s ease;
}
.viewer[data-open="true"]{ opacity:1; visibility:visible; }
.viewer__img{
  max-width:88vw; max-height:82vh; object-fit:contain;
  border-radius:8px; box-shadow:0 24px 60px rgba(0,0,0,.6);
}
.viewer__bar{
  position:absolute; top:0; left:0; right:0;
  display:flex; align-items:center; gap:14px; padding:14px 18px;
  background:linear-gradient(180deg, rgba(0,0,0,.65), transparent);
}
.viewer__title{ font-size:13px; font-weight:700; letter-spacing:.03em; }
.viewer__count{ font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
.viewer__close{
  margin-left:auto; width:34px; height:34px; border-radius:8px;
  font-size:22px; color:var(--text-dim); background:rgba(255,255,255,.06);
}
.viewer__close:hover{ background:var(--surface-3); color:var(--text); }
.viewer__nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:46px; height:70px; border-radius:8px; font-size:30px; line-height:1;
  color:var(--text-dim); background:rgba(255,255,255,.06);
  transition:background .15s ease, color .15s ease;
}
.viewer__nav:hover{ background:var(--surface-3); color:var(--text); }
.viewer__prev{ left:14px; }
.viewer__next{ right:14px; }

/* ===========================================================================
   8. BARRA LATERAL — CHECKLIST DE GIMMICKS
   =========================================================================== */
.backdrop{
  position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.6);
  opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s ease;
}
.backdrop[data-open="true"]{ opacity:1; visibility:visible; }

.panel{
  position:fixed; top:0; right:0; z-index:60;
  width:var(--panel-w); max-width:100%; height:100%;
  display:flex; flex-direction:column;
  background:var(--surface-1); border-left:1px solid var(--border);
  transform:translateX(102%); transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:-18px 0 44px rgba(0,0,0,.5);
}
.panel[data-open="true"]{ transform:translateX(0); }

.panel__head{ padding:18px 20px 14px; border-bottom:1px solid var(--border); }
.panel__top{ display:flex; align-items:center; gap:12px; }
.panel__title{ margin:0; font-size:16px; font-weight:700; }
.panel__close{ margin-left:auto; width:30px; height:30px; border-radius:7px; color:var(--text-dim); font-size:18px; }
.panel__close:hover{ background:var(--surface-3); color:var(--text); }
.panel__hint{ margin:8px 0 0; font-size:11.5px; color:var(--text-mute); line-height:1.45; }

/* Progreso global del gimmick */
.panel__global{ margin-top:14px; }
.panel__global-top{ display:flex; align-items:baseline; gap:10px; font-size:12px; color:var(--text-dim); }
.panel__global-n{ font-size:15px; font-weight:800; color:var(--text); font-variant-numeric:tabular-nums; }
.panel__global-bar{ height:6px; margin-top:7px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
.panel__global-fill{ height:100%; border-radius:99px; background:var(--dx); width:0; transition:width .35s ease; }

.panel__filter{ display:flex; align-items:center; gap:8px; margin-top:13px; font-size:12px; color:var(--text-dim); cursor:pointer; }
.panel__filter input{ accent-color:var(--dx); width:15px; height:15px; cursor:pointer; }

.panel__body{ flex:1; overflow-y:auto; padding:8px 20px 40px; }
.panel__body::-webkit-scrollbar{ width:9px; }
.panel__body::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:9px; }

/* Grupo por SUBTIPO (Ride Eggs, Legend, Bone Buckles...) */
.grupo{ margin-top:20px; }
.grupo__head{
  display:flex; align-items:center; gap:10px; margin-bottom:9px;
  width:100%; text-align:left; cursor:pointer; padding:2px 0;
}
.grupo__chevron{
  flex:0 0 auto; width:14px; height:14px; color:var(--text-mute);
  transition:transform .25s ease;
}
.grupo[data-open="true"] .grupo__chevron{ transform:rotate(90deg); }
.grupo__name{ font-size:12.5px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; }
.grupo__tag{
  padding:1px 6px; border-radius:99px; font-size:9px; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
  background:var(--surface-3); color:var(--text-mute);
}
.grupo__count{ margin-left:auto; font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
/* Cerrado esconde las piezas, NUNCA el resumen: nombre, contador y barra
   quedan fuera del bloque plegable a proposito (Maestro 1 §9). */
.grupo__bar{ height:5px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin-bottom:12px; }
.grupo__fill{ height:100%; width:0; border-radius:99px; transition:width .35s ease; }
.grupo__body{ max-height:0; overflow:hidden; transition:max-height .35s ease; }
.grupo[data-open="true"] .grupo__body{ max-height:8000px; }

/* Linea de procedencia del gimmick (DX / SG) dentro del subtipo */
.linea{ margin-bottom:14px; }
.linea__head{
  display:flex; align-items:baseline; gap:8px; margin-bottom:6px;
  font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
}

  padding:7px 9px; border-radius:7px; margin-bottom:3px;
  transition:background .15s ease;

.pieza:hover{ background:var(--surface-2); }
.pieza__dot{
  flex:0 0 auto; margin-top:5px; width:8px; height:8px; border-radius:50%;

.pieza--tengo    .pieza__dot{ background:var(--owned); box-shadow:none; }
.pieza--cubierto .pieza__dot{ background:var(--owned); box-shadow:none; opacity:.55; }
.pieza--sinvia   .pieza__dot{ background:#e25555; box-shadow:none; }

.pieza__name{ font-size:12.5px; color:var(--text-dim); }
.pieza--tengo .pieza__name, .pieza--cubierto .pieza__name{ color:var(--text); }
.pieza__acabado{

  font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  background:var(--surface-3); color:var(--text-mute);
}

   la enciclopedia (Maestro 1 §5.6). */

.via{
  padding:2px 7px; border-radius:5px; font-size:9.5px; font-weight:700;
  letter-spacing:.03em; cursor:pointer;
  background:var(--surface-3); color:var(--text-mute);
  transition:background .15s ease, color .15s ease;
}
.via:hover{ background:var(--dx-soft); color:var(--dx); }
.via--tengo{ background:var(--owned-soft); color:var(--owned); }
.via--azar::after{ content:" · azar"; opacity:.7; }

.panel__empty{ padding:22px 4px; text-align:center; font-size:12px; color:var(--text-mute); }
.panel__sinvia{
  margin-top:8px; padding:8px 10px; border-radius:7px; font-size:11px;
  background:rgba(226,85,85,.10); color:#ff9b9b; border:1px solid rgba(226,85,85,.3);
}

   cabecera aguanta en una linea hasta ~1180. Va en su propia consulta para
   no adelantar el resto del responsive.
   =========================================================================== */
@media (max-width: 1180px){
  .mini-stats{ order:3; width:100%; }
  .mini-stat{ flex:1; min-width:0; }
}
@media (max-width: 1080px){
  .header__inner{ gap:14px; }
}
@media (max-width: 720px){
  .main{ padding:20px 14px 70px; }

  .cat__meta{ width:100%; margin-left:0; }
  .grid{ grid-template-columns:repeat(auto-fill, minmax(158px, 1fr)); gap:12px; }
  .panel{ width:100%; }
  .brand__sub{ display:none; }
  .viewer__img{ max-width:96vw; max-height:74vh; }
  .viewer__nav{ width:38px; height:56px; font-size:24px; }
  .viewer__prev{ left:6px; }
  .viewer__next{ right:6px; }

PRODUCTS.forEach(p => { p.month = p.date.slice(0,7); });
const PRODUCTS_BY_ID = PRODUCTS.reduce((m,p)=>{ m[p.id]=p; return m; },{});


/* ===========================================================================
   BLOQUE 4 · ESTADO PERSISTENTE
   ---------------------------------------------------------------------------
   Regla de oro (Maestro 1 §2): solo se persiste el estado del PRODUCTO. Las
   piezas se DERIVAN en cada render — por eso los contadores no pueden mentir
   ni desincronizarse.
   =========================================================================== */
function loadState(){
  let raw = {};
  try{ raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }catch(e){}
  /* Se descartan ids que ya no existen: renombrar un producto no debe dejar
     basura invisible engordando el guardado. */
  const ids = new Set(PRODUCTS.map(p=>p.id));
  const products = {};
  for(const id in (raw.products||{})) if(ids.has(id)) products[id] = raw.products[id];
  return { products, ui: Object.assign({ hideOwned:false, cats:{}, grupos:{} }, raw.ui||{}) };
}
const state = loadState();
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
const getProductState = id => state.products[id] || "pending";

function setProductState(id, valor){
  if(valor === "pending") delete state.products[id];
  else state.products[id] = valor;
  saveState();
  render();
}


/* ===========================================================================
   BLOQUE 5 · INDICES Y DERIVADOS
   =========================================================================== */

/* pieza -> [productos que la traen], TODOS, no solo el primero. Es la mitad
   del valor de la enciclopedia (Maestro 3 §5). Orden nuevo -> viejo. */
const SOURCES = {};
PRODUCTS.forEach(p => (p.contains||[]).forEach(pid => {
  (SOURCES[pid] = SOURCES[pid] || []).push(p);
}));
Object.values(SOURCES).forEach(arr => arr.sort((a,b) => b.date.localeCompare(a.date)));

/* Quien absorbe a quien. Solo para el aviso "viene dentro de" en la tarjeta. */
const absorbidoPor = {};
PRODUCTS.forEach(p => (p.reemplaza||[]).forEach(hijo => {
  if(!(hijo in absorbidoPor)) absorbidoPor[hijo] = p.id;
}));

/* Cobertura TRANSITIVA: basta declarar lo que se absorbe directamente y las
   cadenas se recorren solas (Maestro 3 §4). */
function cadenaAbsorbida(pid, vistos){
  vistos = vistos || new Set();
  const out = new Set();
  const p = PRODUCTS_BY_ID[pid];
  (p && p.reemplaza || []).forEach(h => {
    if(vistos.has(h)) return;               // corta ciclos
    out.add(h);
    cadenaAbsorbida(h, new Set([...vistos, h])).forEach(x => out.add(x));
  });
  return out;
}

/* owned    = productos marcados Obtenido a mano.
   cubiertos = owned + todo lo que sus cadenas absorben.
   La distincion importa: una pieza que solo llega por absorcion se marca
   'cubierto' y dice en que caja viene, no 'tengo'. */
function productosCubiertos(){
  const owned = new Set(PRODUCTS.filter(p => getProductState(p.id)==="owned").map(p=>p.id));
  const cubiertos = new Set(owned);
  owned.forEach(id => cadenaAbsorbida(id).forEach(h => cubiertos.add(h)));
  return { owned, cubiertos };
}

function piezaEstado(piezaId, owned, cubiertos){
  const fuentes = SOURCES[piezaId] || [];
  if(!fuentes.length) return "sinvia";      // error de datos: lo caza audit.py
  if(fuentes.some(p => owned.has(p.id)))     return "tengo";
  if(fuentes.some(p => cubiertos.has(p.id))) return "cubierto";
  return "falta";
}
const esConseguida = e => e === "tengo" || e === "cubierto";

/* La categoria de una tarjeta SE DERIVA de lo que el producto entrega, no se
   declara (Maestro 3 §2.0: "la categoria ya vive en la pieza"). Un producto
   que entrega figura Y gimmick aparece en las dos secciones siendo UNO solo,
   con estado compartido. */
function categoriasDe(p){
  const cats = new Set();
  (p.contains||[]).forEach(pid => {
    const pz = PIEZAS_BY_ID[pid];
    if(pz) cats.add(pz.categoria);
  });
  /* Gimmicks se reserva a lo que entrega EXCLUSIVAMENTE gimmick: sets, boxes
     o promocionales puros. Un producto que ademas trae un driver, un arma o
     una figura no se duplica en Eggs -vive solo en su categoria propia-,
     porque esa es su identidad real y el gimmick que trae de propina ya se
     ve en su desplegable "Incluye". Excepcion: DX RIDEWATTER EGGS, que es
     figura Y gimmick a la vez y se declara aparte via `alsoIn`, no por
     `contains` -asi que esta regla no lo toca-. */
  if(cats.has("gimmick") && cats.size > 1) cats.delete("gimmick");
  return cats;
}
/* alsoIn declara una procedencia extra donde la tarjeta tambien se dibuja. */
const CATEGORIA_DE_PROCEDENCIA = {};
PIEZAS_CATALOG.forEach(p => { CATEGORIA_DE_PROCEDENCIA[p.procedencia] = p.categoria; });

/* Interactivo = "entrega al menos una pieza de gimmick", SIN pasar por el
   filtro de categoriasDe(). Son preguntas distintas: categoriasDe() decide
   DONDE se pinta la tarjeta (y ahi gimmick se retira si hay mezcla, §3.2);
   esto decide si hay algo que marcar. Un driver que ya no aparece en Eggs
   sigue entregando un Ride Eggs y sigue necesitando su selector de estado,
   o esa pieza nunca podria conseguirse. */
const esInteractivo = p => (p.contains||[]).some(pid =>
  (PIEZAS_BY_ID[pid]||{}).categoria === "gimmick");


/* ===========================================================================
   BLOQUE 6 · UTILIDADES
   =========================================================================== */
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Si no consta, N/R. Antes que inventar un precio, se dice que no consta
   (Maestro 1 §8). */
const fmtPrice = v => (v==null) ? null : CURRENCY.symbol + v.toLocaleString(CURRENCY.locale);

const MES_ABBR = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmtDate(d){
  const [y,m,day] = d.split("-");
  return `${day} ${MES_ABBR[Number(m)-1]} ${y.slice(2)}`;
}

const CHEVRON = `<svg class="cat__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <polyline points="9 18 15 12 9 6"/></svg>`;
const CHEVRON_S = `<svg class="grupo__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <polyline points="9 18 15 12 9 6"/></svg>`;


/* ===========================================================================
   BLOQUE 7 · RENDER — CATALOGO CENTRAL
   ---------------------------------------------------------------------------
   categoria [seccion plegable] > procedencia [divisor de texto] > tarjetas
   =========================================================================== */
const catalogEl = document.getElementById("catalog");

function contenidoHTML(p, owned, cubiertos){
  /* Estricto a gimmick (Maestro 1 §3.2 y §4.6): el desplegable existe para
     avisar "esto ademas te da un gimmick", no para relistar la propia figura,
     driver o arma que el producto YA ES. Una TAF que trae un Seed Eggs de
     regalo enseña ese Seed Eggs, no "rider-myth-taf" -listar el producto
     dentro de si mismo no informa de nada-. */
  const piezas = (p.contains||[]).map(id => PIEZAS_BY_ID[id])
    .filter(pz => pz && pz.categoria === "gimmick");
  if(!piezas.length) return "";
  const azar = p.entrega === "incierta";
  const items = piezas.map(pz => {
    const e = piezaEstado(pz.id, owned, cubiertos);
    const acab = (ACABADOS[pz.acabado]||{}).label;
    return `<li class="contents__item contents__item--${e}">
        <span class="contents__dot"></span>
        <span class="contents__name">${esc(pz.name)}${acab?` (${esc(acab)})`:""}</span>
      </li>`;
  }).join("");
  /* El texto distingue lo que de verdad es distinto: en una caja de azar las
     piezas son POSIBLES; en un set vienen GARANTIZADAS. */
  return `
    <details class="contents${azar?' contents--azar':''}">
      <summary class="contents__toggle">
        ${azar ? "Ver posibles contenidos" : "Incluye"}
        <span class="contents__n">${piezas.length}</span>
        <span class="contents__arrow">&#8250;</span>
      </summary>
      <ul class="contents__list">${items}</ul>
    </details>`;
}

function cardHTML(p, owned, cubiertos, catActual){
  const interactivo = esInteractivo(p);
  const st = getProductState(p.id);
  const absorbe = absorbidoPor[p.id];
  const cubierto = cubiertos.has(p.id) && !owned.has(p.id);

  const badges = [];
  const b = (PROCEDENCIAS[p.procedencia]||{}).badge;
  if(b) badges.push(`<span class="badge badge--${b}">${esc(PROCEDENCIAS[p.procedencia].label)}</span>`);
  if(p.entrega === "incierta") badges.push(`<span class="badge badge--azar">Azar</span>`);
  if(categoriasDe(p).size > 1 || (p.alsoIn||[]).length)
    badges.push(`<span class="badge badge--cross">Cruzado</span>`);

  const precio = fmtPrice(p.price);
  const precioHTML = precio
    ? `<span class="card__price">${precio}</span>`
    : `<span class="card__price card__price--nr">${esc(p.priceLabel || "N/R")}</span>`;

  const estados = interactivo ? `
    <div class="states" role="group" aria-label="Estado">
      ${["pending","reserved","owned"].map(s => `
        <button class="state-btn" data-state="${s}" data-set="${esc(p.id)}"
                aria-pressed="${st===s}">${STATES[s]}</button>`).join("")}
    </div>` : "";

  const aviso = absorbe
    ? `<p class="card__covered">Viene dentro de ${esc(PRODUCTS_BY_ID[absorbe].title)}</p>`
    : "";

  return `
    <article class="card" id="prod-${esc(p.id)}"
             data-state="${st}" data-covered="${cubierto}">
      <div class="card__media" data-view="${esc(p.id)}">
        <div class="card__ph">sin imagen</div>
        ${badges.length ? `<div class="card__badges">${badges.join("")}</div>` : ""}
        <span class="card__tick">&#10003;</span>
        <img class="card__img" src="${esc(p.img)}" alt="${esc(p.title)}"
             onload="this.parentNode.classList.add('is-loaded')">
      </div>
      <div class="card__body">
        <h3 class="card__title">${esc(p.title)}</h3>
        ${aviso}
        ${contenidoHTML(p, owned, cubiertos)}
        <div class="card__row">
          <span class="card__date${p.date < HOY ? ' card__date--past':''}">${fmtDate(p.date)}</span>
          ${precioHTML}
        </div>
        ${estados}
      </div>
    </article>`;
}

/* Productos que le tocan a una categoria: los que entregan una pieza suya,
   mas los puente que declaran una procedencia de esa categoria. */
function productosDe(cat){
  return PRODUCTS.filter(p =>
    categoriasDe(p).has(cat) ||
    (p.alsoIn||[]).some(proc => CATEGORIA_DE_PROCEDENCIA[proc] === cat));
}

function renderCatalog(){
  const { owned, cubiertos } = productosCubiertos();
  let html = "";

  CATEGORIA_ORDEN.forEach(cat => {
    if(!(cat in ROTULOS)) return;                 // categoria omitida
    const productos = productosDe(cat);
    if(!productos.length) return;                 // sin producto, no se dibuja

    const interactiva = cat === CATEGORIA_INTERACTIVA;
    const abierta = state.ui.cats[cat] !== false; // por defecto abiertas

    let bloques = "";
    Object.keys(PROCEDENCIAS).forEach(proc => {
      const enEsta = productos.filter(p =>
        (p.procedencia === proc && categoriasDe(p).has(cat)) ||
        ((p.alsoIn||[]).includes(proc) && CATEGORIA_DE_PROCEDENCIA[proc] === cat)
      ).sort((a,b) => b.date.localeCompare(a.date));   // nuevo -> viejo
      if(!enEsta.length) return;

      bloques += `
        <section class="proc">
          <div class="proc__head">
            <span class="proc__name">${esc(PROCEDENCIAS[proc].label)}</span>
            <span class="proc__rule"></span>
            <span class="proc__n">${enEsta.length}</span>
          </div>
          <div class="grid">
            ${enEsta.map(p => cardHTML(p, owned, cubiertos, cat)).join("")}
          </div>
        </section>`;
    });

    /* La categoria interactiva ademas dice cuantos de sus productos tienes.
       Las de consulta solo cuentan cuantos hay: no llevan progreso. */
    let chips = `<span class="chip chip--count">${productos.length} producto${productos.length!==1?'s':''}</span>`;
    if(interactiva){
      const n = productos.filter(p => owned.has(p.id)).length;
      chips += n === productos.length
        ? `<span class="chip chip--done">Completo</span>`
        : `<span class="chip chip--track">${n}/${productos.length} obtenidos</span>`;
    }

    html += `
      <section class="cat" data-open="${abierta}" style="--cat:${CAT_COLOR[cat]}">
        <button class="cat__head" data-cat="${cat}" aria-expanded="${abierta}">
          ${CHEVRON}
          <span class="cat__title">${esc(ROTULOS[cat])}</span>
          <span class="cat__meta">${chips}</span>
        </button>
        <div class="cat__body"><div class="cat__inner">${bloques}</div></div>
      </section>`;
  });

  catalogEl.innerHTML = html || `<p class="panel__empty">Sin catálogo todavía.</p>`;
}


/* ===========================================================================
   BLOQUE 8 · RENDER — BARRA LATERAL (checklist de Gimmicks)
   ---------------------------------------------------------------------------
   Unico panel interactivo del sistema (Maestro 1 §5). Se probo ampliar la
   interactividad a las 7 categorias -una pestaña por categoria, agrupacion
   por nombre para las entidades- y se revirtio: para una checklist de
   merchandising, nadie va a "completar" su coleccion de Drivers o Armas
   como un objetivo aparte, y la pestaña extra solo volvia mas engorrosos
   tanto el panel como el catalogo. Riders, Drivers y Armas se quedan en el
   catalogo central como referencia, sin estado.

   Orden INVERTIDO respecto al catalogo, a proposito (Maestro 1 §5.1): aqui la
   pregunta es "que Legend me falta", no "que hay en DX".
   =========================================================================== */
const panelBody = document.getElementById("panelBody");

function viasHTML(piezaId, owned, cubiertos){
  return (SOURCES[piezaId] || []).map(p => {
    const tengo = owned.has(p.id) || cubiertos.has(p.id);
    const azar  = p.entrega === "incierta";
    return `<span class="via${tengo?' via--tengo':''}${azar?' via--azar':''}"
                  data-goto="${esc(p.id)}" role="link" tabindex="0"
                  title="${esc(p.title)}">${esc(p.title)}</span>`;
  }).join("");
}

function piezaHTML(pz, owned, cubiertos){
  const estado = piezaEstado(pz.id, owned, cubiertos);
  if(state.ui.hideOwned && esConseguida(estado)) return "";
  const acab = (ACABADOS[pz.acabado]||{}).label || "";
  const sinvia = estado === "sinvia"
    ? `<div class="panel__sinvia">Ningún producto la entrega: no se podrá marcar nunca.</div>` : "";
  return `
    <div class="pieza pieza--${estado}">
      <span class="pieza__dot"></span>
      <div class="pieza__main">
        <span class="pieza__name">${esc(pz.name)}</span>${acab?`<span class="pieza__acabado">${esc(acab)}</span>`:""}
        <div class="pieza__vias">${viasHTML(pz.id, owned, cubiertos)}</div>
        ${sinvia}
      </div>
    </div>`;
}

function renderPanel(){
  const { owned, cubiertos } = productosCubiertos();
  const piezas = PIEZAS_CATALOG.filter(p => p.categoria === "gimmick");

  const cuenta = lista => lista.filter(pz => esConseguida(piezaEstado(pz.id, owned, cubiertos))).length;

  /* --- Progreso global y mini barras de la cabecera --- */
  const total = piezas.length;
  const hechas = cuenta(piezas);
  document.getElementById("globalN").textContent   = `${hechas}/${total}`;
  document.getElementById("globalBar").style.width = total ? (hechas/total*100)+"%" : "0%";
  document.getElementById("headerCount").textContent = `${hechas}/${total}`;

  /* Mini barras: una por linea del gimmick masivo, mas el menor aparte.
     Los dos tonos fuertes se reservan al principal. */
  const mini = [];
  Object.entries(PROCEDENCIAS_GIMMICK).forEach(([proc, cfg]) => {
    const lista = piezas.filter(pz => pz.procedencia===proc && !(SUBTIPOS[pz.subtipo]||{}).menor);
    if(!lista.length) return;
    const n = cuenta(lista);
    mini.push(`
      <div class="mini-stat mini-stat--${proc}">
        <div class="mini-stat__top">
          <span class="mini-stat__label">${esc(cfg.label.toUpperCase())}</span>
          <span class="mini-stat__count">${n}/${lista.length}</span>
        </div>
        <div class="mini-stat__bar"><div class="mini-stat__fill" style="width:${n/lista.length*100}%"></div></div>
      </div>`);
  });
  const menores = piezas.filter(pz => (SUBTIPOS[pz.subtipo]||{}).menor);
  if(menores.length){
    const n = cuenta(menores);
    mini.push(`
      <div class="mini-stat mini-stat--menor">
        <div class="mini-stat__top">
          <span class="mini-stat__label">BUCKLES</span>
          <span class="mini-stat__count">${n}/${menores.length}</span>
        </div>
        <div class="mini-stat__bar"><div class="mini-stat__fill" style="width:${n/menores.length*100}%"></div></div>
      </div>`);
  }
  document.getElementById("miniStats").innerHTML = mini.join("");

  /* --- Grupos por subtipo --- */
  let html = "";
  Object.entries(SUBTIPOS).forEach(([subId, sub]) => {
    const piezasSub = piezas.filter(pz => pz.subtipo === subId);
    if(!piezasSub.length) return;

    const n = cuenta(piezasSub);
    const abierto = state.ui.grupos[subId] === true;   // cerrados de inicio
    const color = sub.menor ? "var(--menor)" : "var(--dx)";

    let lineas = "";
    Object.entries(PROCEDENCIAS_GIMMICK).forEach(([proc, cfg]) => {
      const lista = piezasSub.filter(pz => pz.procedencia === proc);
      if(!lista.length) return;
      const ln = cuenta(lista);
      const lcolor = sub.menor ? "var(--menor)" : cfg.color;
      const filas = lista.map(pz => piezaHTML(pz, owned, cubiertos)).join("");
      lineas += `
        <div class="linea">
          <div class="linea__head" style="color:${lcolor}">
            ${esc(cfg.label)} <span class="linea__n">${ln}/${lista.length}</span>
          </div>
          <div class="linea__bar">
            <div class="linea__fill" style="width:${ln/lista.length*100}%;background:${lcolor}"></div>
          </div>
          ${filas || `<p class="panel__empty">Todo conseguido en esta línea.</p>`}
        </div>`;
    });

    html += `
      <section class="grupo" data-open="${abierto}">
        <button class="grupo__head" data-grupo="${subId}" aria-expanded="${abierto}">
          ${CHEVRON_S}
          <span class="grupo__name" style="color:${color}">${esc(sub.label)}</span>
          ${sub.menor?'<span class="grupo__tag">menor</span>':''}
          <span class="grupo__count">${n}/${piezasSub.length}</span>
        </button>
        <div class="grupo__bar">
          <div class="grupo__fill" style="width:${n/piezasSub.length*100}%;background:${color}"></div>
        </div>
        <div class="grupo__body">${lineas}</div>
      </section>`;
  });

  panelBody.innerHTML = html;

  const restantes = total - hechas;
  document.getElementById("panelHint").textContent = restantes
    ? `Marca un producto como Obtenido en el catálogo y sus Eggs se cuentan aquí. Te faltan ${restantes}.`
    : `Colección completa.`;
}


/* ===========================================================================
   BLOQUE 9 · VISOR DE GALERIA
   =========================================================================== */
const viewerEl = document.getElementById("viewer");
const viewerImg = document.getElementById("viewerImg");
let galeria = [], gIndex = 0, gTitulo = "";

function abrirVisor(pid){
  const p = PRODUCTS_BY_ID[pid];
  if(!p) return;
  galeria = (p.gallery && p.gallery.length) ? p.gallery : (p.img ? [p.img] : []);
  if(!galeria.length) return;
  gTitulo = p.title; gIndex = 0;
  document.getElementById("viewerTitle").textContent = gTitulo;
  pintarVisor();
  viewerEl.dataset.open = "true";
}
function pintarVisor(){
  viewerImg.src = galeria[gIndex];
  viewerImg.alt = gTitulo;
  document.getElementById("viewerCount").textContent = `${gIndex+1} / ${galeria.length}`;
}
function cerrarVisor(){ viewerEl.dataset.open = "false"; viewerImg.src = ""; }
function moverVisor(d){
  if(!galeria.length) return;
  gIndex = (gIndex + d + galeria.length) % galeria.length;
  pintarVisor();
}


/* ===========================================================================
   BLOQUE 10 · EVENTOS
   ---------------------------------------------------------------------------
   Delegados en document: el HTML se regenera entero en cada render, asi que
   enganchar listeners a cada nodo obligaria a re-enganchar siempre.
   =========================================================================== */
const panelEl    = document.getElementById("panel");
const backdropEl = document.getElementById("backdrop");

function abrirPanel(){ panelEl.dataset.open="true"; backdropEl.dataset.open="true"; }
function cerrarPanel(){ panelEl.dataset.open="false"; backdropEl.dataset.open="false"; }

document.getElementById("openPanel").addEventListener("click", abrirPanel);
document.getElementById("closePanel").addEventListener("click", cerrarPanel);
backdropEl.addEventListener("click", cerrarPanel);

document.getElementById("hideOwned").addEventListener("change", e => {
  state.ui.hideOwned = e.target.checked;
  saveState();
  renderPanel();
});

document.getElementById("viewerClose").addEventListener("click", cerrarVisor);
document.getElementById("viewerPrev").addEventListener("click", e => { e.stopPropagation(); moverVisor(-1); });
document.getElementById("viewerNext").addEventListener("click", e => { e.stopPropagation(); moverVisor(1); });
viewerEl.addEventListener("click", e => { if(e.target === viewerEl) cerrarVisor(); });

document.addEventListener("keydown", e => {
  if(viewerEl.dataset.open === "true"){
    if(e.key === "Escape")     cerrarVisor();
    if(e.key === "ArrowLeft")  moverVisor(-1);
    if(e.key === "ArrowRight") moverVisor(1);
    return;
  }
  if(e.key === "Escape" && panelEl.dataset.open === "true") cerrarPanel();
});

document.addEventListener("click", e => {
  /* Estado de un producto */
  const btn = e.target.closest("[data-set]");
  if(btn){ setProductState(btn.dataset.set, btn.dataset.state); return; }

  /* Plegar/desplegar una categoria */
  const cab = e.target.closest("[data-cat]");
  if(cab){
    const cat = cab.dataset.cat;
    const sec = cab.closest(".cat");
    const abierta = sec.dataset.open !== "true";
    sec.dataset.open = abierta;
    cab.setAttribute("aria-expanded", abierta);
    state.ui.cats[cat] = abierta;
    saveState();
    return;
  }

  /* Plegar/desplegar un grupo del panel */
  const gh = e.target.closest("[data-grupo]");
  if(gh){
    const id = gh.dataset.grupo;
    const sec = gh.closest(".grupo");
    const abierto = sec.dataset.open !== "true";
    sec.dataset.open = abierto;
    gh.setAttribute("aria-expanded", abierto);
    state.ui.grupos[id] = abierto;
    saveState();
    return;
  }

  /* Salto desde una via de la checklist al producto que la trae */
  const via = e.target.closest("[data-goto]");
  if(via){ irAProducto(via.dataset.goto); return; }

  /* Abrir la galeria */
  const media = e.target.closest("[data-view]");
  if(media){ abrirVisor(media.dataset.view); return; }
});

/* El salto tiene que ABRIR la categoria del producto antes de desplazarse:
   si esta plegada, scrollIntoView apunta a un elemento de altura cero. */
function irAProducto(pid){
  cerrarPanel();
  const el = document.getElementById("prod-"+pid);
  if(!el) return;
  const sec = el.closest(".cat");
  if(sec && sec.dataset.open !== "true"){
    sec.dataset.open = "true";
    const cab = sec.querySelector("[data-cat]");
    if(cab){
      cab.setAttribute("aria-expanded","true");
      state.ui.cats[cab.dataset.cat] = true;
      saveState();
    }
  }
  requestAnimationFrame(() => {
    el.scrollIntoView({ behavior:"smooth", block:"center" });
    el.classList.remove("card--flash");
    void el.offsetWidth;                    // reinicia la animacion
    el.classList.add("card--flash");
  });
}


/* ===========================================================================
   BLOQUE 11 · ARRANQUE
   =========================================================================== */
function render(){ renderCatalog(); renderPanel(); }

document.getElementById("hideOwned").checked = !!state.ui.hideOwned;

if(REPO_ESTADO === "cerrado"){
  const nov = document.getElementById("novedades");
  nov.hidden = false;
  document.getElementById("novedadesBody").textContent =
    "Todo lo que llegue tras el cierre del repositorio aparecerá aquí.";
}

render();
</script>
